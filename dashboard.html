<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Panel Privado">
    <title>SGG - Panel de Gastos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Fondos animados -->
    <div class="bg-shapes" aria-hidden="true">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <!-- Contenedor Principal Expandido -->
    <main class="main-container dashboard-container">
        <header class="dashboard-header">
            <div>
                <h2>Panel de Control</h2>
                <p>Hola, <span id="user-display" style="font-weight: bold;">Usuario</span></p>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-icon" aria-label="Cambiar tema"><i class="fas fa-moon"></i></button>
                <button id="logout-btn" class="btn-solid" style="padding: 10px 20px; font-size: 0.9rem;">Salir</button>
            </div>
        </header>

        <!-- Resumen Financiero -->
        <section class="summary-card" aria-labelledby="summary-heading">
            <h3 id="summary-heading">Total Gastado</h3>
            <p id="total-monto" class="total-amount">$0.00</p>
        </section>

        <div class="dashboard-grid">
            <!-- Formulario de Carga/Edición -->
            <section class="form-section">
                <h3>Cargar Gasto</h3>
                <form id="gasto-form" novalidate>
                    <input type="hidden" id="gasto-id">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <input type="number" id="monto" step="0.01" min="0.01" placeholder="Monto ($)" required aria-describedby="error-monto">
                            <span class="error-message msg error" id="error-monto"></span>
                        </div>
                        <div class="form-group">
                            <input type="date" id="fecha" required aria-describedby="error-fecha">
                            <span class="error-message msg error" id="error-fecha"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <select id="categoria" required aria-describedby="error-categoria">
                            <option value="" disabled selected>Categoría</option>
                            <option value="Alimentación">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Ocio">Ocio</option>
                        </select>
                        <span class="error-message msg error" id="error-categoria"></span>
                    </div>

                    <div class="form-group">
                        <input type="text" id="descripcion" placeholder="Descripción breve" required aria-describedby="error-descripcion">
                        <span class="error-message msg error" id="error-descripcion"></span>
                    </div>

                    <div class="btn-group form-actions" style="flex-direction: row;">
                        <button type="submit" id="submit-btn" class="btn-rainbow-border">Guardar</button>
                        <button type="button" id="cancel-btn" class="btn-solid hidden">Cancelar</button>
                    </div>
                </form>
            </section>

            <!-- Historial -->
            <section class="table-section">
                <h3>Historial</h3>
                <div class="table-responsive">
                    <table class="gastos-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Categoría</th>
                                <th>Descripción</th>
                                <th>Monto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="gastos-tbody">
                            <!-- Inyección JS -->
                        </tbody>
                    </table>
                </div>
                <p id="empty-message" class="msg" style="display: block; text-align: center;">No hay gastos registrados.</p>
            </section>
        </div>
    </main>

    <!-- Modal de Confirmación (Baja Lógica) -->
    <div id="delete-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="main-container modal-content">
            <h2 style="font-size: 2rem;">¿Eliminar registro?</h2>
            <p>El monto dejará de contarse en tu panel global.</p>
            <div class="btn-group" style="flex-direction: row; justify-content: center; margin-top: 20px;">
                <button id="confirm-delete-btn" class="btn-rainbow-border" style="background: #ffebee; color: #d32f2f;">Eliminar</button>
                <button id="cancel-delete-btn" class="btn-solid">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/gastos.js"></script>
</body>
</html>

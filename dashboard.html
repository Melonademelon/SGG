<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de control y gestión de gastos del SGG.">
    <title>SGG - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema"><i class="fas fa-moon" aria-hidden="true"></i></button>

    <main class="main-container" style="max-width: 1000px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
            <h2 style="margin-bottom: 0; font-size: 2rem;">Mi Billetera</h2>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="user-greeting" style="font-weight: 600; color: var(--text-color);"></span>
                <button id="btn-logout" class="btn-solid" style="padding: 8px 16px; font-size: 0.9rem; background: #d32f2f;">Cerrar Sesión</button>
            </div>
        </header>

        <div class="form-row" style="display: flex; flex-wrap: wrap; gap: 30px;">
            <form id="form-gastos" style="flex: 1; min-width: 300px; background: var(--input-bg); padding: 25px; border-radius: 12px;" novalidate>
                <h3 id="form-title" style="margin-bottom: 20px;">Registrar Nuevo Gasto</h3>
                <input type="hidden" id="gasto-id">
                
                <div class="form-group">
                    <label for="gasto-desc" class="visually-hidden">Descripción</label>
                    <input type="text" id="gasto-desc" placeholder="Descripción (ej. Supermercado)" required>
                </div>
                
                <div class="form-group">
                    <label for="gasto-monto" class="visually-hidden">Monto</label>
                    <input type="number" id="gasto-monto" placeholder="Monto ($)" required min="0.01" step="0.01">
                </div>
                
                <div class="form-group">
                    <label for="gasto-cat" class="visually-hidden">Categoría</label>
                    <select id="gasto-cat" required>
                        <option value="" disabled selected>Selecciona una Categoría</option>
                        <option value="Alimentación">Alimentación</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gasto-fecha" class="visually-hidden">Fecha del Gasto</label>
                    <input type="date" id="gasto-fecha" required title="Fecha">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" id="btn-save-gasto" class="btn-solid" style="flex: 1;">Guardar</button>
                    <button type="button" id="btn-cancel-edit" class="btn-solid hidden" style="background: #555;">Cancelar</button>
                </div>
            </form>

            <section style="flex: 1.5; min-width: 300px; display: flex; flex-direction: column;" aria-label="Historial de gastos">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--input-bg); padding: 15px 20px; border-radius: 12px;">
                    <h3 style="margin: 0;">Total Gastado:</h3>
                    <h3 id="total-gastos" style="color: #e81d1d; margin: 0; font-size: 1.8rem;">$0.00</h3>
                </div>
                <div id="lista-gastos" role="list" style="overflow-y: auto; max-height: 400px; padding-right: 10px;"></div>
            </section>
        </div>
    </main>

    <dialog id="modal-delete" style="padding: 30px; border-radius: 15px; border: none; max-width: 400px; margin: auto; text-align: center; background: var(--bg-color); color: var(--text-color);">
        <h3 style="margin-bottom: 15px; color: #d32f2f;"><i class="fas fa-exclamation-triangle"></i> Confirmar Eliminación</h3>
        <p style="margin-bottom: 25px;">¿Estás seguro de que deseas eliminar este gasto de tu historial?</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button id="btn-confirm-delete" class="btn-solid" style="background: #d32f2f;">Sí, eliminar</button>
            <button id="btn-close-modal" class="btn-solid" style="background: #555;">Cancelar</button>
        </div>
    </dialog>

    <script src="./js/main.js"></script>
    <script src="./js/gastos.js"></script>
</body>
</html>

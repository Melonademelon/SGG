<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pantalla de inicio de sesión segura.">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema"><i class="fas fa-moon" aria-hidden="true"></i></button>
    <div class="bg-shapes" aria-hidden="true"><div class="shape shape1"></div><div class="shape shape2"></div><div class="shape shape3"></div></div>

    <main class="main-container">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus datos para acceder a tu panel financiero.</p>
        
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="login-identifier" placeholder="Usuario o Correo electrónico" required aria-label="Usuario o Correo electrónico">
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Contraseña" required aria-label="Contraseña">
                <button class="field-icon toggle-password" data-target="login-password" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>
            
            <div class="nav-links" style="justify-content: flex-end; margin-top:-10px; margin-bottom:15px;">
                <a href="./recuperar.html"><i class="fas fa-key" aria-hidden="true"></i> ¿Olvidaste tu contraseña?</a>
            </div>

            <div class="btn-group" style="margin-top: 10px;">
                <button type="submit" id="btn-submit-login" class="btn-solid">Ingresar</button>
            </div>
        </form>
        <div id="login-msg" class="msg" role="alert"></div>

        <div class="nav-links" style="justify-content: center; margin-top: 30px;">
            <span>¿No tienes una cuenta aún? <a href="./registro.html">Regístrate aquí</a></span>
        </div>
    </main>

    <script src="./js/main.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Iniciar Sesión">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <header class="header-simple">
        <button id="theme-toggle-btn" class="btn btn-secondary" type="button" aria-label="Cambiar modo de color">
            🌙 Modo Noche
        </button>
    </header>

    <main class="auth-container">
        <div class="card auth-card">
            <h1 class="logo text-center">SGG <span>| Iniciar Sesión</span></h1>

            <form id="form-login" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" placeholder="usuario@correo.com" required aria-describedby="error-login-email">
                    <span class="error-message" id="error-login-email" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" required aria-describedby="error-login-password">
                    <span class="error-message" id="error-login-password" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
                <span class="error-message text-center block mt-1" id="error-login-general" aria-live="assertive"></span>
            </form>

            <div class="auth-links text-center mt-1">
                <a href="registro.html" class="link">¿No tienes cuenta? Regístrate</a> | 
                <a href="recuperar.html" class="link">Recuperar Contraseña</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

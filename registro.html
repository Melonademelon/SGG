<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en tu cuenta de SGG">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar a modo oscuro o claro"><i class="fas fa-moon" aria-hidden="true"></i></button>
    <div class="bg-shapes" aria-hidden="true"><div class="shape shape1"></div><div class="shape shape2"></div><div class="shape shape3"></div></div>

    <main class="main-container">
        <h2>Acceso al Panel</h2>
        <p>Ingresa tus credenciales para continuar.</p>
        
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="login-identifier" placeholder="Usuario o Correo" aria-label="Ingresa tu usuario o correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Contraseña" aria-label="Ingresa tu contraseña" required>
                <button type="button" class="field-icon toggle-password" data-target="login-password" aria-label="Mostrar u ocultar contraseña" style="background: none; border: none;">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            
            <div class="nav-links" style="justify-content: flex-end; margin-top:-10px; margin-bottom:15px;">
                <a href="recuperar.html"><i class="fas fa-key" aria-hidden="true"></i> ¿Olvidaste tu contraseña?</a>
            </div>

            <div class="btn-group" style="margin-top: 10px;">
                <button type="submit" id="btn-submit-login" class="btn-solid">Entrar</button>
            </div>
        </form>
        <div id="login-msg" class="msg" aria-live="polite"></div>

        <div class="nav-links" style="justify-content: center; margin-top: 30px;">
            <a href="index.html">Volver al Inicio</a>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

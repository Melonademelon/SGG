<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Regístrate de forma segura en nuestro sistema.">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema"><i class="fas fa-moon" aria-hidden="true"></i></button>
    <div class="bg-shapes" aria-hidden="true"><div class="shape shape1"></div><div class="shape shape2"></div><div class="shape shape3"></div></div>

    <main class="main-container">
        <h2>Crear Cuenta</h2>
        <p style="margin-bottom: 25px;">Únete gratis y empieza a gestionar tus finanzas.</p>
        
        <form id="register-form">
            <div class="form-row">
                <div class="form-group"><input type="text" id="reg-name" placeholder="Nombre" required aria-label="Nombre"></div>
                <div class="form-group"><input type="text" id="reg-surname" placeholder="Apellido" required aria-label="Apellido"></div>
            </div>
            <div class="form-group">
                <input type="date" id="reg-dob" required title="Fecha de nacimiento" aria-label="Fecha de nacimiento">
            </div>
            <div class="form-group"><input type="text" id="reg-email" placeholder="Correo electrónico" required aria-label="Correo electrónico"></div>
            <div class="form-group"><input type="text" id="reg-username" placeholder="Nombre de Usuario" required aria-label="Nombre de Usuario"></div>
            
            <div class="form-group">
                <input type="password" id="reg-password" placeholder="Contraseña" required aria-label="Contraseña">
                <button class="field-icon toggle-password" data-target="reg-password" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <ul class="password-requirements" aria-label="Requisitos de seguridad de la contraseña">
                <li class="requirement invalid" id="req-len"><i class="fas fa-times" aria-hidden="true"></i> Mínimo 8 caracteres</li>
                <li class="requirement invalid" id="req-upper"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra mayúscula</li>
                <li class="requirement invalid" id="req-lower"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra minúscula</li>
                <li class="requirement invalid" id="req-num"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 número</li>
                <li class="requirement invalid" id="req-spec"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 carácter especial</li>
            </ul>

            <div class="form-group">
                <input type="password" id="reg-password-confirm" placeholder="Repetir Contraseña" required aria-label="Repetir Contraseña">
                <button class="field-icon toggle-password" data-target="reg-password-confirm" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <div class="form-group">
                <select id="reg-question" required aria-label="Pregunta de Seguridad">
                    <option value="" disabled selected>Pregunta de Seguridad</option>
                    <option value="mascota">¿Nombre de tu primera mascota?</option>
                    <option value="escuela">¿Nombre de tu escuela primaria?</option>
                    <option value="ciudad">¿En qué ciudad naciste?</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="reg-answer" placeholder="Respuesta secreta de seguridad" required aria-label="Respuesta secreta de seguridad">
            </div>

            <button type="submit" id="btn-submit-reg" class="btn-rainbow-border" disabled>Registrarme</button>
        </form>
        <div id="register-msg" class="msg" role="alert"></div>

        <div class="nav-links" style="justify-content: center;">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>

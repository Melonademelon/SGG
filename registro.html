<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Crear Cuenta">
    <title>SGG - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <header class="header-simple">
        <button id="theme-toggle-btn" class="btn btn-secondary" type="button" aria-label="Cambiar modo de color">
            🌙 Modo Noche
        </button>
    </header>

    <main class="auth-container">
        <div class="card auth-card">
            <h1 class="logo text-center">SGG <span>| Registro</span></h1>

            <form id="form-register" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" name="nombre" autocomplete="name" placeholder="Juan Pérez" required aria-describedby="error-reg-nombre">
                    <span class="error-message" id="error-reg-nombre" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="usuario@correo.com" required aria-describedby="error-reg-email">
                    <span class="error-message" id="error-reg-email" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required aria-describedby="error-reg-password">
                    <span class="error-message" id="error-reg-password" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>
                <span class="error-message text-center block mt-1" id="error-reg-general" aria-live="assertive"></span>
            </form>

            <div class="auth-links text-center mt-1">
                <a href="login.html" class="link">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>

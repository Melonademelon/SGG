<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Redirección">
    <title>SGG - Redireccionando</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        const usuarioLogueado = JSON.parse(localStorage.getItem('usuario_logueado'));
        if (usuarioLogueado && usuarioLogueado.email) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

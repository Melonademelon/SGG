<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Control de Acceso y Registro de Usuarios">
    <meta name="theme-color" content="#0b5ed7">
    <title>SGG - Autenticación</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <header class="header-simple">
        <button id="theme-toggle-btn" class="btn btn-secondary" type="button" aria-label="Cambiar a modo noche">
            🌙 Modo Noche
        </button>
    </header>

    <main class="auth-container">
        <div class="card auth-card">
            <h1 class="logo text-center">SGG <span>| Iniciar Sesión</span></h1>
            
            <div class="auth-tabs" role="tablist" aria-label="Opciones de autenticación">
                <button id="tab-login" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="form-login" tabindex="0">Ingresar</button>
                <button id="tab-register" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="form-register" tabindex="-1">Registrarse</button>
            </div>

            <!-- Formulario de Login -->
            <form id="form-login" class="auth-form" novalidate role="tabpanel" aria-labelledby="tab-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" placeholder="ejemplo@correo.com" required aria-describedby="error-login-email" aria-invalid="false">
                    <span class="error-message" id="error-login-email" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" required aria-describedby="error-login-password" aria-invalid="false">
                    <span class="error-message" id="error-login-password" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
                <span class="error-message text-center block mt-1" id="error-login-general" aria-live="assertive"></span>
            </form>

            <!-- Formulario de Registro -->
            <form id="form-register" class="auth-form hidden" novalidate role="tabpanel" aria-labelledby="tab-register" aria-hidden="true">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" name="nombre" autocomplete="name" placeholder="Juan Pérez" required aria-describedby="error-reg-nombre" aria-invalid="false">
                    <span class="error-message" id="error-reg-nombre" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="ejemplo@correo.com" required aria-describedby="error-reg-email" aria-invalid="false">
                    <span class="error-message" id="error-reg-email" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required aria-describedby="error-reg-password" aria-invalid="false">
                    <span class="error-message" id="error-reg-password" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Crear Cuenta</button>
                <span class="error-message text-center block mt-1" id="error-reg-general" aria-live="assertive"></span>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>

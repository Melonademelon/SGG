<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso al Sistema de Gestión de Gastos.">
    <title>SGG - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="main-container">
        <!-- Formulario de Login -->
        <section id="login-section" aria-labelledby="login-title">
            <h2 id="login-title" style="text-align: center; margin-bottom: 25px;">Iniciar Sesión</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-identifier" class="visually-hidden">Usuario o Correo</label>
                    <input type="text" id="login-identifier" placeholder="Usuario o Correo" required>
                </div>
                <div class="form-group password-container">
                    <label for="login-password" class="visually-hidden">Contraseña</label>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                    <i class="fas fa-eye toggle-password" id="toggle-login-pwd" aria-label="Mostrar contraseña" role="button" tabindex="0"></i>
                </div>
                <div id="login-msg" aria-live="polite"></div>
                <button type="submit" id="btn-submit-login" class="btn-solid">Ingresar</button>
            </form>
            <p style="text-align: center; margin-top: 25px;">
                ¿No tienes cuenta? <a href="#" id="link-register" style="color: var(--primary-color); font-weight: 600;">Regístrate aquí</a>
            </p>
        </section>

        <!-- Formulario de Registro -->
        <section id="register-section" class="hidden" aria-labelledby="register-title">
            <h2 id="register-title" style="text-align: center; margin-bottom: 25px;">Crear Cuenta</h2>
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="reg-nombre" class="visually-hidden">Nombre</label>
                    <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <label for="reg-username" class="visually-hidden">Usuario</label>
                    <input type="text" id="reg-username" placeholder="Nombre de usuario" required>
                </div>
                <div class="form-group password-container">
                    <label for="reg-password" class="visually-hidden">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Contraseña" required>
                    <i class="fas fa-eye toggle-password" id="toggle-reg-pwd" aria-label="Mostrar contraseña" role="button" tabindex="0"></i>
                </div>
                <div id="register-msg" aria-live="polite"></div>
                <button type="submit" class="btn-solid">Registrarse</button>
            </form>
            <p style="text-align: center; margin-top: 25px;">
                ¿Ya tienes cuenta? <a href="#" id="link-login" style="color: var(--primary-color); font-weight: 600;">Inicia Sesión</a>
            </p>
        </section>
    </main>

    <script src="./js/login.js"></script>
</body>
</html>

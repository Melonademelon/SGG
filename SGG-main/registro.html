<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Regístrate de forma segura en nuestro sistema.">
    <title>Crear Cuenta - SGG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="./js/db.js"></script>
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema"><i class="fas fa-moon" aria-hidden="true"></i></button>

    <main class="main-container">
        <h2>Crear Cuenta</h2>
        <p>Únete gratis y empieza a gestionar tus finanzas.</p>
        
        <form id="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="reg-name">Nombre</label>
                    <input type="text" id="reg-name" placeholder="Nombre" required aria-label="Nombre">
                </div>
                <div class="form-group">
                    <label for="reg-surname">Apellido</label>
                    <input type="text" id="reg-surname" placeholder="Apellido" required aria-label="Apellido">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-dob">Fecha de Nacimiento</label>
                <input type="date" id="reg-dob" required aria-label="Fecha de nacimiento">
            </div>
            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required aria-label="Correo electrónico">
            </div>
            <div class="form-group">
                <label for="reg-username">Nombre de Usuario</label>
                <input type="text" id="reg-username" placeholder="Usuario" required aria-label="Nombre de Usuario">
            </div>
            
            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" placeholder="Contraseña" required aria-label="Contraseña">
                <button type="button" class="field-icon toggle-password" data-target="reg-password" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <ul class="password-requirements" aria-label="Requisitos de seguridad de la contraseña">
                <li class="requirement invalid" id="req-len"><i class="fas fa-times" aria-hidden="true"></i> Mínimo 8 caracteres</li>
                <li class="requirement invalid" id="req-upper"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra mayúscula</li>
                <li class="requirement invalid" id="req-lower"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra minúscula</li>
                <li class="requirement invalid" id="req-num"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 número</li>
                <li class="requirement invalid" id="req-spec"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 carácter especial</li>
            </ul>

            <div class="form-group">
                <label for="reg-password-confirm">Repetir Contraseña</label>
                <input type="password" id="reg-password-confirm" placeholder="Repetir Contraseña" required aria-label="Repetir Contraseña">
                <button type="button" class="field-icon toggle-password" data-target="reg-password-confirm" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <div class="form-group">
                <label for="reg-question">Pregunta de Seguridad</label>
                <select id="reg-question" required aria-label="Pregunta de Seguridad">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="mascota">¿Nombre de tu primera mascota?</option>
                    <option value="escuela">¿Nombre de tu escuela primaria?</option>
                    <option value="ciudad">¿En qué ciudad naciste?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-answer">Respuesta Secreta</label>
                <input type="text" id="reg-answer" placeholder="Respuesta de seguridad" required aria-label="Respuesta secreta de seguridad">
            </div>

            <button type="submit" id="btn-submit-reg" class="btn-rainbow-border" disabled>Registrarme</button>
        </form>
        <div id="register-msg" class="msg" role="alert"></div>

        <div class="nav-links" style="justify-content: center;">
            <a href="./login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </main>

    <script src="./js/main.js"></script>
    <script src="./js/registro.js"></script>
</body>
</html>

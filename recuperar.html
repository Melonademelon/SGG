<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
    <div class="bg-shapes"><div class="shape shape1"></div><div class="shape shape2"></div><div class="shape shape3"></div></div>

    <main class="main-container">
        <h2>Registro</h2>
        <p style="margin-bottom: 25px;">Comienza tu viaje financiero hoy.</p>
        <form id="register-form">
            <div class="form-row">
                <div class="form-group"><input type="text" id="reg-name" placeholder="Nombre/s" required></div>
                <div class="form-group"><input type="text" id="reg-surname" placeholder="Apellido/s" required></div>
            </div>
            <div class="form-group"><input type="date" id="reg-dob" required title="Fecha de nacimiento"></div>
            <div class="form-group"><input type="text" id="reg-email" placeholder="Correo electrónico" required></div>
            <div class="form-group"><input type="text" id="reg-username" placeholder="Nombre de usuario único" required></div>
            
            <div class="form-group">
                <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                <i class="fas fa-eye field-icon toggle-password" data-target="reg-password"></i>
            </div>
            
            <ul class="password-requirements">
                <li class="requirement invalid" id="req-len"><i class="fas fa-times"></i> Mínimo 8 caracteres</li>
                <li class="requirement invalid" id="req-upper"><i class="fas fa-times"></i> Al menos 1 letra Mayúscula</li>
                <li class="requirement invalid" id="req-lower"><i class="fas fa-times"></i> Al menos 1 letra Minúscula</li>
                <li class="requirement invalid" id="req-num"><i class="fas fa-times"></i> Al menos 1 número</li>
                <li class="requirement invalid" id="req-spec"><i class="fas fa-times"></i> Al menos 1 carácter especial (!@#$%)</li>
            </ul>

            <div class="form-group">
                <input type="password" id="reg-password-confirm" placeholder="Repetir Contraseña" required>
                <i class="fas fa-eye field-icon toggle-password" data-target="reg-password-confirm"></i>
            </div>

            <div class="form-group">
                <select id="reg-question" required>
                    <option value="" disabled selected>Pregunta de Seguridad</option>
                    <option value="mascota">¿Nombre de tu primera mascota?</option>
                    <option value="escuela">¿Nombre de tu escuela primaria?</option>
                    <option value="ciudad">¿En qué ciudad naciste?</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="reg-answer" placeholder="Respuesta secreta" required>
            </div>

            <button type="submit" id="btn-submit-reg" class="btn-rainbow-border" disabled>Finalizar Registro</button>
        </form>
        <div id="register-msg" class="msg"></div>

        <div class="nav-links" style="justify-content: center;">
            <a href="index.html">Volver al Inicio de Sesión</a>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>

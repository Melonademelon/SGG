<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Recuperar Contraseña">
    <title>SGG - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <header class="header-simple">
        <button id="theme-toggle-btn" class="btn btn-secondary" type="button" aria-label="Cambiar modo de color">
            🌙 Modo Noche
        </button>
    </header>

    <main class="auth-container">
        <div class="card auth-card">
            <h1 class="logo text-center">SGG <span>| Recuperar</span></h1>

            <form id="form-recuperar" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="rec-email">Correo Electrónico Registrado:</label>
                    <input type="email" id="rec-email" name="email" autocomplete="email" placeholder="usuario@correo.com" required aria-describedby="error-rec-email">
                    <span class="error-message" id="error-rec-email" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="rec-new-password">Nueva Contraseña:</label>
                    <input type="password" id="rec-new-password" name="new-password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required aria-describedby="error-rec-new-password">
                    <span class="error-message" id="error-rec-new-password" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Restablecer Contraseña</button>
                <span class="error-message text-center block mt-1" id="error-rec-general" aria-live="assertive"></span>
            </form>

            <div class="auth-links text-center mt-1">
                <a href="login.html" class="link">Volver al Iniciar Sesión</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/recuperar.js"></script>
</body>
</html>

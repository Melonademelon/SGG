<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recupera el acceso a tu cuenta de forma segura.">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Cambiar tema"><i class="fas fa-moon" aria-hidden="true"></i></button>
    <div class="bg-shapes" aria-hidden="true"><div class="shape shape1"></div><div class="shape shape2"></div><div class="shape shape3"></div></div>

    <main class="main-container">
        <h2>Recuperar Contraseña</h2>
        <p>Restablece tus credenciales mediante tu desafío de seguridad.</p>
        
        <div id="step1-forgot">
            <div class="form-group">
                <input type="text" id="forgot-username" placeholder="Introduce tu Nombre de Usuario" aria-label="Nombre de Usuario">
            </div>
            <button type="button" onclick="verifyUserForReset()" class="btn-solid">Verificar Usuario</button>
        </div>

        <form id="forgot-form" class="hidden">
            <p id="security-question-label" style="font-weight: bold; margin-bottom: 15px; color: var(--text-color);"></p>
            
            <div class="form-group">
                <input type="text" id="forgot-answer" placeholder="Tu respuesta secreta" required aria-label="Respuesta secreta">
            </div>

            <div class="form-group">
                <input type="password" id="forgot-new-password" placeholder="Nueva Contraseña" required aria-label="Nueva Contraseña">
                <button class="field-icon toggle-password" data-target="forgot-new-password" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <ul class="password-requirements" aria-label="Requisitos de seguridad de la contraseña">
                <li class="requirement invalid" id="f-req-len"><i class="fas fa-times" aria-hidden="true"></i> Mínimo 8 caracteres</li>
                <li class="requirement invalid" id="f-req-upper"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra mayúscula</li>
                <li class="requirement invalid" id="f-req-lower"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 letra minúscula</li>
                <li class="requirement invalid" id="f-req-num"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 número</li>
                <li class="requirement invalid" id="f-req-spec"><i class="fas fa-times" aria-hidden="true"></i> Al menos 1 carácter especial</li>
            </ul>

            <div class="form-group">
                <input type="password" id="forgot-new-password-confirm" placeholder="Repetir Nueva Contraseña" required aria-label="Repetir Nueva Contraseña">
                <button class="field-icon toggle-password" data-target="forgot-new-password-confirm" aria-label="Mostrar contraseña"><i class="fas fa-eye" aria-hidden="true"></i></button>
            </div>

            <button type="submit" id="btn-submit-forgot" class="btn-rainbow-border" disabled>Restablecer Contraseña</button>
        </form>

        <div id="forgot-msg" class="msg" role="alert"></div>

        <div class="nav-links" style="justify-content: center; margin-top: 25px;">
            <a href="login.html">Volver al inicio de sesión</a>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/recuperar.js"></script>
</body>
</html>
